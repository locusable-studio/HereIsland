name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: HereIsland.xcodeproj
  SCHEME: HereIsland
  APP_BUNDLE_NAME: Here Island
  DMG_PREFIX: HereIsland
  TEAM_ID: 9Y64TRM77N

jobs:
  release:
    name: Build and Release
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          # Versioned asset: immutable forever for this tag.
          DMG_NAME="${DMG_PREFIX}-${VERSION}.dmg"
          # Website / marketing asset: fixed name so /releases/latest/download stays stable.
          STABLE_DMG_NAME="${DMG_PREFIX}.dmg"
          REPO="${{ github.repository }}"
          # Appcast enclosure MUST use the versioned release URL (immutable).
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${DMG_NAME}"
          # Official site button should use this URL (never changes across releases).
          LATEST_DOWNLOAD_URL="https://github.com/${REPO}/releases/latest/download/${STABLE_DMG_NAME}"
          # Sparkle feed URL (path stable; file content updates on main).
          APPCAST_URL="https://raw.githubusercontent.com/${REPO}/main/Updates/appcast.xml"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "dmg_name=$DMG_NAME"
            echo "stable_dmg_name=$STABLE_DMG_NAME"
            echo "download_url=$DOWNLOAD_URL"
            echo "latest_download_url=$LATEST_DOWNLOAD_URL"
            echo "appcast_url=$APPCAST_URL"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION (build $BUILD_NUMBER)"
          echo "Immutable release asset: $DOWNLOAD_URL"
          echo "Stable website download: $LATEST_DOWNLOAD_URL"
          echo "Sparkle appcast: $APPCAST_URL"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Metal Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MAJOR" -ge 26 ]; then
            for i in 1 2 3 4 5; do
              sudo xcodebuild -downloadComponent MetalToolchain && break
              sleep 10
            done
            xcrun -f metal >/dev/null 2>&1 || {
              echo "::error::Metal Toolchain unavailable"
              exit 1
            }
          fi

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY"

      - name: Set up notarization credentials
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Set up Sparkle signing key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$SPARKLE_KEY" > ~/private_keys/sparkle_ed.key

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Stamp version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "$BUILD"

      - name: Archive
        run: |
          sudo DevToolsSecurity -enable

          # Drop Atoll-specific mach-services entitlement if still present.
          plutil -remove com.apple.security.mach-services \
            HereIsland/HereIsland.entitlements 2>/dev/null || true

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath "build/${DMG_PREFIX}.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/${DMG_PREFIX}.xcarchive" \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Sign nested Sparkle components
        run: |
          APP_PATH="build/export/${APP_BUNDLE_NAME}.app"
          ENTITLEMENTS_PATH="$RUNNER_TEMP/app.entitlements"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"

          find "$APP_PATH" -name "*.xpc" -print0 | while IFS= read -r -d '' xpc; do
            codesign --force --options runtime --sign "$CODESIGN_IDENTITY" "$xpc"
          done

          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_FW" ]; then
            codesign --force --options runtime --sign "$CODESIGN_IDENTITY" "$SPARKLE_FW"
          fi

          codesign --force --options runtime \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "$CODESIGN_IDENTITY" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          APP_PATH="build/export/${APP_BUNDLE_NAME}.app"
          npx create-dmg "$APP_PATH" build/ --overwrite --no-code-sign
          GENERATED_DMG=$(find build -maxdepth 1 -name "*.dmg" | head -1)
          mv "$GENERATED_DMG" "build/${DMG_NAME}"

      - name: Sign DMG
        run: |
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          codesign --force --sign "$CODESIGN_IDENTITY" "build/${DMG_NAME}"

      - name: Notarize DMG
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          xcrun notarytool submit "build/${DMG_NAME}" \
            --key ~/private_keys/AuthKey_${API_KEY_ID}.p8 \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" \
            --wait
          xcrun stapler staple "build/${DMG_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          STABLE_DMG_NAME="${{ steps.version.outputs.stable_dmg_name }}"

          # Fixed-name copy for a permanent /releases/latest/download/HereIsland.dmg URL.
          # Copy after notarization+staple so the ticket is preserved; do not re-sign.
          cp "build/${DMG_NAME}" "build/${STABLE_DMG_NAME}"

          gh release create "$TAG" \
            "build/${DMG_NAME}" \
            "build/${STABLE_DMG_NAME}" \
            --title "Here Island ${VERSION}" \
            --notes "$(cat <<EOF
          ## Downloads

          - **Website / always-latest:** ${{ steps.version.outputs.latest_download_url }}
          - **This version (immutable):** ${{ steps.version.outputs.download_url }}

          Sparkle feed: ${{ steps.version.outputs.appcast_url }}
          EOF
          )" \
            --verify-tag

      - name: Update Sparkle appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          DOWNLOAD_URL="${{ steps.version.outputs.download_url }}"
          DMG_SIZE=$(stat -f%z "build/${DMG_NAME}")

          DERIVED_DATA=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings 2>/dev/null \
            | grep -m1 BUILD_DIR | awk '{print $3}' | sed 's|/Build/Products||')
          SIGN_UPDATE=$(find "$DERIVED_DATA" -name "sign_update" -type f 2>/dev/null | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            SIGN_UPDATE=$(find ~/Library/Developer/Xcode -name "sign_update" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$SIGN_UPDATE" ]; then
            echo "::error::Sparkle sign_update not found"
            exit 1
          fi

          # sign_update prints: sparkle:edSignature="..." length="..."
          SIGN_OUTPUT=$("$SIGN_UPDATE" --ed-key-file ~/private_keys/sparkle_ed.key "build/${DMG_NAME}" 2>&1) || true
          echo "$SIGN_OUTPUT"
          SIGNATURE=$(printf '%s\n' "$SIGN_OUTPUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$SIGNATURE" ]; then
            echo "::error::Failed to obtain Sparkle edSignature"
            exit 1
          fi

          PUB_DATE=$(date -u '+%a, %d %b %Y %H:%M:%S +0000')
          export VERSION BUILD DOWNLOAD_URL DMG_SIZE PUB_DATE SIGNATURE

          # Prepend the new item; keep prior immutable version entries.
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("Updates/appcast.xml")
          text = path.read_text() if path.exists() else ""

          new_item = f"""        <item>
              <title>{os.environ['VERSION']}</title>
              <pubDate>{os.environ['PUB_DATE']}</pubDate>
              <sparkle:version>{os.environ['BUILD']}</sparkle:version>
              <sparkle:shortVersionString>{os.environ['VERSION']}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
              <enclosure url="{os.environ['DOWNLOAD_URL']}" length="{os.environ['DMG_SIZE']}" type="application/octet-stream" sparkle:edSignature="{os.environ['SIGNATURE']}"/>
          </item>
          """

          # Drop any existing item for the same marketing version (retag safety).
          version = re.escape(os.environ["VERSION"])
          text = re.sub(
              rf"\s*<item>\s*<title>{version}</title>.*?</item>\s*",
              "\n",
              text,
              flags=re.S,
          )

          channel_open = re.search(r"<channel>\s*(?:<title>.*?</title>\s*)?", text)
          if not channel_open:
              text = f"""<?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Here Island</title>
          {new_item}    </channel>
          </rss>
          """
          else:
              insert_at = channel_open.end()
              # Ensure title exists once.
              if "<title>" not in text[channel_open.start():insert_at]:
                  prefix = text[: channel_open.start() + len("<channel>")]
                  text = prefix + "\n        <title>Here Island</title>\n" + text[channel_open.start() + len("<channel>"):]
                  channel_open = re.search(r"<channel>\s*(?:<title>.*?</title>\s*)?", text)
                  insert_at = channel_open.end()
              text = text[:insert_at] + "\n" + new_item + text[insert_at:]

          path.write_text(text)
          print(path.read_text())
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          DEFAULT_BRANCH=${DEFAULT_BRANCH:-main}

          git fetch origin "$DEFAULT_BRANCH"
          git stash push -u -m "appcast" -- Updates/appcast.xml
          git checkout -B "$DEFAULT_BRANCH" "origin/${DEFAULT_BRANCH}"
          git stash pop || true
          git add Updates/appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast changes"
          else
            git commit -m "ci: update appcast for ${VERSION}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
