name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: HereIsland.xcodeproj
  SCHEME: HereIsland
  APP_BUNDLE_NAME: Here Island
  DMG_PREFIX: HereIsland
  TEAM_ID: 9Y64TRM77N

jobs:
  release:
    name: Build and Release
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          DMG_NAME="${DMG_PREFIX}-${VERSION}.dmg"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION (build $BUILD_NUMBER)"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Metal Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MAJOR" -ge 26 ]; then
            for i in 1 2 3 4 5; do
              sudo xcodebuild -downloadComponent MetalToolchain && break
              sleep 10
            done
            xcrun -f metal >/dev/null 2>&1 || {
              echo "::error::Metal Toolchain unavailable"
              exit 1
            }
          fi

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY"

      - name: Set up notarization credentials
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Set up Sparkle signing key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$SPARKLE_KEY" > ~/private_keys/sparkle_ed.key

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Stamp version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "$BUILD"

      - name: Archive
        run: |
          sudo DevToolsSecurity -enable

          # Drop Atoll-specific mach-services entitlement if still present.
          plutil -remove com.apple.security.mach-services \
            HereIsland/HereIsland.entitlements 2>/dev/null || true

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath "build/${DMG_PREFIX}.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/${DMG_PREFIX}.xcarchive" \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Sign nested Sparkle components
        run: |
          APP_PATH="build/export/${APP_BUNDLE_NAME}.app"
          ENTITLEMENTS_PATH="$RUNNER_TEMP/app.entitlements"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"

          find "$APP_PATH" -name "*.xpc" -print0 | while IFS= read -r -d '' xpc; do
            codesign --force --options runtime --sign "$CODESIGN_IDENTITY" "$xpc"
          done

          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_FW" ]; then
            codesign --force --options runtime --sign "$CODESIGN_IDENTITY" "$SPARKLE_FW"
          fi

          codesign --force --options runtime \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "$CODESIGN_IDENTITY" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          APP_PATH="build/export/${APP_BUNDLE_NAME}.app"
          npx create-dmg "$APP_PATH" build/ --overwrite --no-code-sign
          GENERATED_DMG=$(find build -maxdepth 1 -name "*.dmg" | head -1)
          mv "$GENERATED_DMG" "build/${DMG_NAME}"

      - name: Sign DMG
        run: |
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          codesign --force --sign "$CODESIGN_IDENTITY" "build/${DMG_NAME}"

      - name: Notarize DMG
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          xcrun notarytool submit "build/${DMG_NAME}" \
            --key ~/private_keys/AuthKey_${API_KEY_ID}.p8 \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" \
            --wait
          xcrun stapler staple "build/${DMG_NAME}"

      - name: Update Sparkle appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${DMG_NAME}"
          DMG_SIZE=$(stat -f%z "build/${DMG_NAME}")

          DERIVED_DATA=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings 2>/dev/null \
            | grep -m1 BUILD_DIR | awk '{print $3}' | sed 's|/Build/Products||')
          SIGN_UPDATE=$(find "$DERIVED_DATA" -name "sign_update" -type f 2>/dev/null | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            SIGN_UPDATE=$(find ~/Library/Developer/Xcode -name "sign_update" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$SIGN_UPDATE" ]; then
            echo "::error::Sparkle sign_update not found"
            exit 1
          fi

          SIGNATURE=$("$SIGN_UPDATE" --ed-key-file ~/private_keys/sparkle_ed.key "build/${DMG_NAME}" \
            | sed -n 's/.*"\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$SIGNATURE" ]; then
            # Fallback: parse sparkle:edSignature= form
            SIGNATURE=$("$SIGN_UPDATE" --ed-key-file ~/private_keys/sparkle_ed.key "build/${DMG_NAME}" 2>&1 \
              | sed -n 's/.*edSignature=\([^ ]*\).*/\1/p' | head -1)
          fi
          if [ -z "$SIGNATURE" ]; then
            echo "::error::Failed to sign update for Sparkle"
            "$SIGN_UPDATE" --ed-key-file ~/private_keys/sparkle_ed.key "build/${DMG_NAME}" || true
            exit 1
          fi

          PUB_DATE=$(date -u '+%a, %d %b %Y %H:%M:%S +0000')
          cat > Updates/appcast.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Here Island</title>
                  <item>
                      <title>${VERSION}</title>
                      <pubDate>${PUB_DATE}</pubDate>
                      <sparkle:version>${BUILD}</sparkle:version>
                      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                      <enclosure url="${DOWNLOAD_URL}" length="${DMG_SIZE}" type="application/octet-stream" sparkle:edSignature="${SIGNATURE}"/>
                  </item>
              </channel>
          </rss>
          EOF

          # Rewrite without leading indentation from heredoc
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Updates/appcast.xml")
          lines = [line[4:] if line.startswith("    ") else line for line in p.read_text().splitlines(True)]
          p.write_text("".join(lines))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Updates/appcast.xml
          git commit -m "ci: update appcast for ${VERSION}" || echo "No appcast changes"
          # Push to the default branch that contains Updates/
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"

          gh release create "$TAG" \
            "build/${DMG_NAME}" \
            --title "Here Island ${VERSION}" \
            --generate-notes \
            --verify-tag
